spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

server.port=4000
grpc.server.port=9002
logging.level.root=info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
logging.pattern.level=%5p [%X{requestId:-}]

# Kafka producer: don't block a request for a minute when the broker is down
spring.kafka.producer.properties.max.block.ms=5000

# Billing gRPC call: deadline per attempt, then retry + circuit breaker
billing.service.deadline-seconds=5
resilience4j.retry.instances.billing.max-attempts=2
resilience4j.retry.instances.billing.wait-duration=500ms
resilience4j.retry.instances.billing.retry-exceptions=io.grpc.StatusRuntimeException
resilience4j.circuitbreaker.instances.billing.sliding-window-size=10
resilience4j.circuitbreaker.instances.billing.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.billing.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.billing.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.billing.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.billing.record-exceptions=io.grpc.StatusRuntimeException
