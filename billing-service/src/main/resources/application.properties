spring.application.name=billing-service

server.port=4001
grpc.server.port=9001
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Database (overridden by SPRING_DATASOURCE_* in docker-compose; falls back to H2 for tests)
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
logging.pattern.level=%5p [%X{requestId:-}]

# Kafka: publishes invoice events (topic billing), consumes patient events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.group-id=billing-service
spring.kafka.consumer.auto-offset-reset=earliest

# Default consultation currency for manually created invoices
billing.default-currency=USD
