spring.application.name=appointment-service
server.port=4003

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Database (SPRING_DATASOURCE_* in docker-compose; embedded H2 fallback for tests)
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
logging.pattern.level=%5p [%X{requestId:-}]

# Kafka: publishes appointment events (topic appointment)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.properties.max.block.ms=5000

# Clinic rules. Hours are interpreted in clinic.timezone (CLINIC_TIMEZONE), Monday to Friday.
clinic.timezone=UTC
clinic.open-time=09:00
clinic.close-time=17:00
clinic.enforce-hours=true
clinic.slot-minutes=30

# Downstream services (internal Docker network)
patient.service.address=localhost
patient.service.grpc.port=9002
patient.service.deadline-seconds=3
auth.service.url=http://localhost:4005
auth.service.connect-timeout-ms=2000
auth.service.read-timeout-ms=3000

# Resilience4j: one retry, then a circuit breaker per dependency
resilience4j.retry.instances.patient.max-attempts=2
resilience4j.retry.instances.patient.wait-duration=300ms
resilience4j.retry.instances.patient.retry-exceptions=io.grpc.StatusRuntimeException
resilience4j.circuitbreaker.instances.patient.sliding-window-size=10
resilience4j.circuitbreaker.instances.patient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.patient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.patient.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.patient.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.patient.record-exceptions=io.grpc.StatusRuntimeException

resilience4j.retry.instances.auth.max-attempts=2
resilience4j.retry.instances.auth.wait-duration=300ms
resilience4j.retry.instances.auth.retry-exceptions=com.pm.appointmentservice.client.DownstreamUnavailableException
resilience4j.circuitbreaker.instances.auth.sliding-window-size=10
resilience4j.circuitbreaker.instances.auth.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.auth.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auth.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.auth.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.auth.record-exceptions=com.pm.appointmentservice.client.DownstreamUnavailableException

# Kafka consumer: patient events (cancel appointments of deleted patients, refresh names)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.group-id=appointment-service
spring.kafka.consumer.auto-offset-reset=earliest
