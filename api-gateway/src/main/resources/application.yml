server:
  port: 4004 # Gateway listens on port 4004

spring:
  cloud:
    gateway:
      # Fail fast instead of hanging when a downstream service is stuck (504).
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s

      # Browser access from the frontend dev server. Preflight (OPTIONS)
      # requests are answered here and never reach the JWT filter.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Request-Id]
            exposedHeaders: [X-Request-Id]
            allowCredentials: true
            maxAge: 3600

      # Service base URLs. AUTH_SERVICE_URL is required (set in docker-compose);
      # the patient URL defaults to the Docker service name.
      routes:
        # Public: login only. No other auth-service path is exposed publicly.
        - id: auth-login-route
          uri: ${auth.service.url}
          predicates:
            - Path=/auth/login
          filters:
            - RewritePath=/auth/login,/login

        # /api/auth/** -> auth-service /auth/** (current user, change password)
        - id: auth-service-route
          uri: ${auth.service.url}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # /api/users/** -> auth-service /users/**
        - id: users-route
          uri: ${auth.service.url}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # /api/patients/** -> patient-service /patients/**
        - id: patient-service-route
          uri: ${patient.service.url:http://patient-service:4000}
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # /api/billing/** -> billing-service /billing/**
        - id: billing-service-route
          uri: ${billing.service.url:http://billing-service:4001}
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # OpenAPI docs per service (consolidated in a later step)
        - id: api-docs-patient-route
          uri: ${patient.service.url:http://patient-service:4000}
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-route
          uri: ${auth.service.url}
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
